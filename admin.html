<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - PEFA PVT SCHOOL</title>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
    <h1>PEFA PVT SCHOOL</h1>
</header>

<section class="hero">

    <div class="card">

        <h2>Administrator Login</h2>

        <form id="adminLogin">

            <input
                type="text"
                id="username"
                placeholder="Username"
                required>

            <br><br>

            <input
                type="password"
                id="password"
                placeholder="Password"
                required>

            <br><br>

            <button class="btn" type="submit">
                Login
            </button>

        </form>

        <br>

        <a href="login.html">← Back to Portal</a>

    </div>

</section>

<script type="module" src="js/admin.js"></script>

</body>
</html>

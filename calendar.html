<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Academic Calendar</title>

<link rel="stylesheet" href="css/style.css">

</head>


<body>


<header>

<h1>PEFA PVT SCHOOL</h1>

</header>



<section class="hero">


<div class="card">


<h2>Add School Event</h2>


<form id="calendarForm">


<input 
type="text"
id="eventName"
placeholder="Event Name"
required>


<br><br>


<input 
type="date"
id="eventDate"
required>


<br><br>


<select id="eventType">


<option>
Select Type
</option>


<option>
Exam
</option>


<option>
Holiday
</option>


<option>
Meeting
</option>


<option>
Event
</option>


</select>


<br><br>


<button class="btn">
Add Event
</button>


</form>


</div>


<br>


<div id="calendarList"></div>



</section>




<script type="module" src="js/calendar.js"></script>


</body>

</html>

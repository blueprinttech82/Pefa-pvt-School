<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Registration</title>

<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
    <h1>Student Registration</h1>
</header>

<section class="hero">

<div class="card">

<h2>Register New Student</h2>

<form id="studentForm">

<input type="text" id="fullname" placeholder="Full Name" required><br><br>

<input type="date" id="dob" required><br><br>

<select id="gender" required>
<option value="">Select Gender</option>
<option>Male</option>
<option>Female</option>
</select>

<br><br>

<select id="class" required>
<option value="">Select Class</option>
<option>Reception</option>
<option>Baby Class</option>
<option>Middle Class</option>
<option>Top Class</option>
<option>Standard 1</option>
<option>Standard 2</option>
<option>Standard 3</option>
<option>Standard 4</option>
<option>Standard 5</option>
<option>Standard 6</option>
<option>Standard 7</option>
<option>Standard 8</option>
</select>

<br><br>

<input type="text" id="parentPhone" placeholder="Parent Phone Number">

<br><br>

<input type="text" id="address" placeholder="Home Address">

<br><br>

<input type="text" id="admission" placeholder="Admission Number" required>

<br><br>

<button class="btn">Register Student</button>

</form>

</div>

</section>

<script type="module" src="js/student.js"></script>

</body>
</html>

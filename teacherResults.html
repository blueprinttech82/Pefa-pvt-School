<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Teacher Results - PEFA PVT SCHOOL</title>

<link rel="stylesheet" href="css/style.css">

</head>


<body>


<header>

<h1>PEFA PVT SCHOOL</h1>

</header>



<section class="hero">


<div class="card">


<h2>Enter Student Results</h2>



<form id="resultForm">


<select id="studentSelect" required>

<option value="">
Select Student
</option>

</select>


<br><br>



<select id="class" required>

<option value="">
Select Class
</option>

<option>Standard 1</option>
<option>Standard 2</option>
<option>Standard 3</option>
<option>Standard 4</option>
<option>Standard 5</option>
<option>Standard 6</option>
<option>Standard 7</option>
<option>Standard 8</option>

</select>


<br><br>



<select id="term" required>

<option value="">
Select Term
</option>

<option>Term 1</option>
<option>Term 2</option>
<option>Term 3</option>

</select>


<br><br>



<input 
type="number"
id="year"
value="2026"
placeholder="Academic Year"
required>


<br><br>



<select id="subject" required>

<option value="">
Select Subject
</option>

<option>English</option>
<option>Chichewa</option>
<option>Mathematics</option>
<option>Science</option>
<option>Social & Religious Education</option>
<option>Agriculture</option>
<option>Life Skills</option>
<option>Expressive Arts</option>

</select>


<br><br>



<input

type="number"

id="marks"

placeholder="Enter Marks"

required>


<br><br>



<button class="btn">

Save Result

</button>



</form>



</div>


</section>




<script type="module" src="js/results.js"></script>


</body>

</html>

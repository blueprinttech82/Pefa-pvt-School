<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Teacher Registration</title>

<link rel="stylesheet" href="css/style.css">
</head>

<body>

<header>
<h1>PEFA PVT SCHOOL</h1>
</header>


<section class="hero">

<div class="card">

<h2>Register Teacher</h2>


<form id="teacherForm">

<input 
type="text" 
id="name"
placeholder="Full Name"
required>

<br><br>


<input 
type="text"
id="phone"
placeholder="Phone Number"
required>

<br><br>


<input 
type="email"
id="email"
placeholder="Email Address">

<br><br>


<select id="subject" required>

<option value="">Select Subject</option>

<option>English</option>
<option>Chichewa</option>
<option>Mathematics</option>
<option>Science</option>
<option>Social & Religious Education</option>
<option>Agriculture</option>
<option>Life Skills</option>
<option>Expressive Arts</option>

</select>

<br><br>


<select id="class">

<option value="">Assigned Class</option>

<option>Standard 1</option>
<option>Standard 2</option>
<option>Standard 3</option>
<option>Standard 4</option>
<option>Standard 5</option>
<option>Standard 6</option>
<option>Standard 7</option>
<option>Standard 8</option>

</select>


<br><br>

<button class="btn">
Register Teacher
</button>


</form>


</div>

</section>


<script type="module" src="js/teacherRegister.js"></script>


</body>
</html>
